<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Jay Park Tour Map</title>

  <link rel="stylesheet" href="tour-map.css">
</head>

<body>

  <main class="map-page">

    <a href="index.html" class="back">
      ← BACK
    </a>

    <h1>WORLD TOUR MAP</h1>
    <p>2027 JAY PARK WORLD TOUR</p>

    <div class="map-container">

      <img src="worldmap.png"
           alt="World Map"
           class="world-map">

      <div class="pin new-york">
  <span class="city-name">NEW YORK</span>
</div>

<div class="pin london">
  <span class="flag">🇬🇧</span>
  <span class="city-name">LONDON</span>
</div>

<div class="pin paris">
  <span class="flag">🇫🇷</span>
  <span class="city-name">PARIS</span>
</div>

<div class="pin tokyo">
  <span class="flag">🇯🇵</span>
  <span class="city-name">TOKYO</span>
</div>

<div class="pin seoul">
  <span class="flag">🇰🇷</span>
  <span class="city-name">SEOUL</span>
</div>

    <div class="cities">
      <span>NEW YORK</span>
      <span>LONDON</span>
      <span>PARIS</span>
      <span>TOKYO</span>
      <span>SEOUL</span>
    </div>

  </main>

</body>
</html>
