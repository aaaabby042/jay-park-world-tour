<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>2027 Jay Park World Tour</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="poster">

    <!-- TOP RIGHT TEXT -->
    <div class="slogan">
      JAY 4 UR HEART
    </div>


    <!-- MAIN TITLE -->
    <header class="title">
      <h1>
        <span>2027</span>
        <span>JAY PARK</span>

        <a href="tour-map.html" class="tour-link">
          WORLD TOUR
        </a>
      </h1>
    </header>


    <!-- TOUR DATES -->
    <section class="tour-dates">


      <!-- NEW YORK -->
      <div class="date">

        <a href="newyork.html" class="city-link">
          <span>NEW YORK</span>
          <span>2.22</span>
        </a>

        <div class="hover-card">
          <img src="ny.jpg" alt="Jay Park New York">
          <p>JAY PARK IN NEW YORK</p>
        </div>

      </div>


      <!-- LONDON -->
      <div class="date">

        <a href="london.html" class="city-link">
          <span>LONDON</span>
          <span>3.01</span>
        </a>

        <div class="hover-card">
          <img src="ld.jpg" alt="Jay Park London">
          <p>JAY PARK IN LONDON</p>
        </div>

      </div>


      <!-- PARIS -->
      <div class="date">

        <a href="paris.html" class="city-link">
          <span>PARIS</span>
          <span>3.18</span>
        </a>

        <div class="hover-card">
          <img src="prs.jpg" alt="Jay Park Paris">
          <p>JAY PARK IN PARIS</p>
        </div>

      </div>


      <!-- TOKYO -->
      <div class="date">

        <a href="tokyo.html" class="city-link">
          <span>TOKYO</span>
          <span>3.27</span>
        </a>

        <div class="hover-card">
          <img src="tyo.jpg" alt="Jay Park Tokyo">
          <p>JAY PARK IN TOKYO</p>
        </div>

      </div>


      <!-- SEOUL -->
      <div class="date">

        <a href="seoul.html" class="city-link">
          <span>SEOUL</span>
          <span>4.05</span>
        </a>

        <div class="hover-card">
          <img src="sl.jpg" alt="Jay Park Seoul">
          <p>JAY PARK IN SEOUL</p>
        </div>

      </div>


    </section>


    <!-- ARTIST IMAGE + MUSIC VIDEO -->
    <div class="artist">

      <img src="jay.PNG" alt="Jay Park">

      <div class="tv-screen">

        <video autoplay muted loop playsinline controls>
          <source src="jay-mv.mov"
                  type="video/quicktime">
          Your browser does not support video.
        </video>

      </div>

    </div>


  </main>

</body>
</html>
